[pytest]
testpaths = tests app
asyncio_mode = auto
# 每个测试用自己的事件循环 —— async engine 的连接池绑定在创建它的循环上，
# 跨循环复用会报 "Event loop is closed"（见 docs/07-bug-log.md BUG-005）
asyncio_default_fixture_loop_scope = function
# 把 docstring 里的示例也当测试跑 —— 文档写错会被抓到，不会烂掉
addopts = --doctest-modules
# ORM 模型 TestSession 以 Test 开头，pytest 会误当测试类收集。
# 收窄收集规则：只把 tests/ 下 test_*.py 里的 Test* 类当测试。
python_classes = Test*Case
